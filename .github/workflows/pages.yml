# 部署到 GitHub Pages：把 index.html 和 MediaPipe Pose 偵測元件組成網站
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  POSE_VERSION: "0.5.1675469404"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site (page + MediaPipe Pose from npm)
        run: |
          set -euo pipefail
          mkdir -p _site/vendor/pose
          cp index.html _site/
          npm pack "@mediapipe/pose@${POSE_VERSION}"
          tar xzf "mediapipe-pose-${POSE_VERSION}.tgz"
          for f in pose.js pose_web.binarypb \
                   pose_solution_packed_assets_loader.js pose_solution_packed_assets.data \
                   pose_solution_simd_wasm_bin.js pose_solution_simd_wasm_bin.wasm \
                   pose_solution_wasm_bin.js pose_solution_wasm_bin.wasm \
                   pose_landmark_full.tflite pose_landmark_lite.tflite; do
            cp "package/$f" _site/vendor/pose/
          done
          chmod -R a+r _site
          ls -la _site _site/vendor/pose
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
